<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Benchmark: premium-saas-web skill vs no skill, tested with Claude Opus 5.5</title>
  <desc id="d">Same one-line prompts, same model (Claude Opus 5.5), isolated runs with no memory. With the skill 98 percent of automated quality checks passed, without it 75 percent. The skill run takes about 11 minutes and 2.70 dollars per page, the plain run about 2.3 minutes and 0.70 dollars.</desc>
  <defs>
    <style>
      .sans{font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
      .mono{font-family:'JetBrains Mono','Cascadia Code','SF Mono',Consolas,'Liberation Mono',monospace}
      .grow{animation:grow 1.6s cubic-bezier(.2,.8,.2,1) both}
      .grow2{animation:grow 1.6s .25s cubic-bezier(.2,.8,.2,1) both}
      .shine{animation:shine 3.2s ease-in-out infinite}
      @keyframes grow{from{transform:scaleX(0)}}
      @keyframes shine{0%{transform:translateX(-200px)}60%,100%{transform:translateX(900px)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
    <filter id="b" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="b8" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="8"/></filter>
    <linearGradient id="hot" x1="0" x2="1"><stop offset="0" stop-color="#FF2A00"/><stop offset=".55" stop-color="#FF7300"/><stop offset="1" stop-color="#FFB15C"/></linearGradient>
    <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="frame"><rect width="1280" height="420" rx="28"/></clipPath>
    <clipPath id="bar1"><rect x="0" y="0" width="720" height="44" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="#0D1017"/>
    <ellipse cx="180" cy="-40" rx="380" ry="160" fill="#FF2A00" filter="url(#b)" opacity=".55"/>
    <ellipse cx="160" cy="-110" rx="330" ry="140" fill="#0D1017" filter="url(#b)"/>
    <g stroke="#fff" stroke-opacity=".05"><path d="M440 150V350M640 150V350M840 150V350M1040 150V350"/></g>

    <text x="72" y="78" class="mono" font-size="13" letter-spacing="1.5" fill="#FF8A3D">BENCHMARK · CLAUDE OPUS 5.5</text>
    <text x="72" y="122" class="sans" font-size="38" font-weight="600" letter-spacing="-1.4" fill="#fff">Same prompt. Same model. <tspan fill="#fff" fill-opacity=".45">One skill.</tspan></text>
    <text x="1208" y="78" text-anchor="end" class="mono" font-size="13" fill="#fff" fill-opacity=".45">4 one-line prompts · isolated runs · no memory</text>

    <!-- bars -->
    <g class="sans">
      <text x="72" y="196" font-size="16" font-weight="600" fill="#fff">With skill</text>
      <text x="72" y="216" font-size="13" fill="#fff" fill-opacity=".5">premium-saas-web</text>
      <g transform="translate(240 172)">
        <rect width="900" height="44" rx="12" fill="#fff" fill-opacity=".05"/>
        <g class="grow" style="transform-origin:0 0">
          <rect y="8" width="882" height="36" rx="12" fill="url(#hot)" filter="url(#b8)" opacity=".55"/>
          <rect width="882" height="44" rx="12" fill="url(#hot)"/>
          <g clip-path="url(#bar1)"><rect class="shine" width="160" height="44" fill="url(#sh)"/></g>
        </g>
        <text x="862" y="30" text-anchor="end" font-size="20" font-weight="700" fill="#140A04">98%</text>
      </g>

      <text x="72" y="276" font-size="16" font-weight="600" fill="#fff" fill-opacity=".8">No skill</text>
      <text x="72" y="296" font-size="13" fill="#fff" fill-opacity=".5">plain Claude</text>
      <g transform="translate(240 252)">
        <rect width="900" height="44" rx="12" fill="#fff" fill-opacity=".05"/>
        <g class="grow2" style="transform-origin:0 0"><rect width="675" height="44" rx="12" fill="#3A4152"/></g>
        <text x="655" y="30" text-anchor="end" font-size="20" font-weight="700" fill="#fff">75%</text>
      </g>
      <text x="1208" y="246" text-anchor="end" class="mono" font-size="12" fill="#fff" fill-opacity=".4">automated</text>
      <text x="1208" y="264" text-anchor="end" class="mono" font-size="12" fill="#fff" fill-opacity=".4">checks</text>
    </g>

    <!-- chips -->
    <g class="sans" transform="translate(72 336)">
      <g><rect width="200" height="44" rx="12" fill="#191D2A" stroke="#fff" stroke-opacity=".08"/><text x="18" y="28" font-size="15" fill="#fff"><tspan font-weight="700" fill="#FF8A3D">+22.5 pts</tspan> quality</text></g>
      <g transform="translate(214 0)"><rect width="300" height="44" rx="12" fill="#191D2A" stroke="#fff" stroke-opacity=".08"/><text x="18" y="28" font-size="15" fill="#fff" fill-opacity=".85">~11 min vs ~2.3 min per page</text></g>
      <g transform="translate(528 0)"><rect width="300" height="44" rx="12" fill="#191D2A" stroke="#fff" stroke-opacity=".08"/><text x="18" y="28" font-size="15" fill="#fff" fill-opacity=".85">~$2.70 vs ~$0.70 API cost</text></g>
      <g transform="translate(842 0)"><rect width="294" height="44" rx="12" fill="#191D2A" stroke="#fff" stroke-opacity=".08"/><text x="18" y="28" font-size="15" fill="#fff" fill-opacity=".85">self-reviews in a real browser</text></g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1279" height="419" rx="27.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>
